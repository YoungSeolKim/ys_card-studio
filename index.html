<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 캐러셀 스튜디오 (Step 3 완정형)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
    body { margin: 0; background: #f4f1ea; color: #222; }
    header {
      background: #fff; padding: 12px 20px; border-bottom: 1px solid #e0dcd3;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 900; }
    .container {
      display: grid;
      grid-template-columns: 360px 1fr 340px;
      gap: 16px;
      padding: 16px;
      max-width: 1480px;
      margin: 0 auto;
    }
    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e5e0d5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel h2 {
      margin: 0 0 2px 0;
      font-size: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    label { font-size: 12.5px; font-weight: 700; display: block; margin-bottom: 4px; }
    .sub-hint { font-size: 11px; color: #777; margin-top: -2px; margin-bottom: 4px; line-height: 1.35; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 13px;
    }
    textarea { resize: vertical; min-height: 64px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > div { flex: 1; }
    input[type="color"] {
      width: 100%; height: 34px; border: 1px solid #ccc; border-radius: 6px;
      cursor: pointer; background: #fff; padding: 2px;
    }
    input[type="range"] { width: 100%; cursor: pointer; }
    .canvas-area {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #e9e5dc; border-radius: 12px; padding: 20px; min-height: 540px;
    }
    canvas {
      max-width: 100%; max-height: 65vh;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border-radius: 4px; background: #000;
    }
    .slide-nav {
      display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center;
    }
    button {
      background: #2b2b2b; color: #fff; border: none; padding: 8px 12px;
      border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #444; }
    button:disabled { background: #999; cursor: not-allowed; }
    button.primary { background: #b59257; color: #fff; }
    button.primary:hover { background: #9c7b44; }
    button.insta { background: #d62976; color: #fff; }
    button.insta:hover { background: #b51f60; }
    button.outline { background: #f4f1ea; color: #333; border: 1px solid #ccc; }
    button.outline:hover { background: #e5e0d5; }
    .btn-group { display: flex; gap: 8px; width: 100%; margin-top: 12px; }
    .btn-group button { flex: 1; }

    .status-box {
      font-size: 12px; padding: 8px 10px; border-radius: 6px;
      background: #f8f6f0; border: 1px solid #e0d9c8; display: none;
    }
    .rec-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 230px; overflow-y: auto;
    }
    .rec-item {
      background: #f9f7f2; border: 1px solid #e0d9c8; border-radius: 8px;
      padding: 8px 10px; font-size: 12.5px; line-height: 1.4;
      display: flex; flex-direction: column; gap: 6px;
    }
    .rec-item-text { font-weight: 700; color: #222; white-space: pre-wrap; }
    .rec-actions { display: flex; gap: 6px; }
    .rec-actions button {
      padding: 4px 8px; font-size: 11px; border-radius: 4px; flex: 1;
    }
    details summary {
      font-size: 12px; color: #555; cursor: pointer; font-weight: 700;
    }
  </style>
</head>
<body>

<header>
  <h1>🥔 나만의 캐러셀 스튜디오 (인스타 URL 로더 완성형)</h1>
  <span style="font-size:12px; color:#666;">Mac / iPhone / Android 웹 호환</span>
</header>

<div class="container">
  <!-- 좌측 패널: 인스타 URL 로더 & AI 본문 분석 -->
  <div class="panel">
    <h2>1. 인스타그램 주소로 가져오기</h2>
    <div>
      <label>인스타그램 게시물 URL (단일 / 캐러셀 지원)</label>
      <div class="row">
        <input type="text" id="instaUrlInput" placeholder="https://www.instagram.com/p/..." />
        <button id="fetchInstaBtn" class="insta" style="white-space:nowrap;">가져오기</button>
      </div>
      <div id="instaStatus" class="status-box" style="margin-top:6px;"></div>
    </div>

    <details>
      <summary>⚙️ 인스타 우회 설정 & 빠른 이미지 추가</summary>
      <div style="margin-top:8px; display:flex; flex-direction:column; gap:8px;">
        <div class="sub-hint">
          기본 내장 프록시로 자동 추출합니다. 막힐 경우 RapidAPI 키를 넣거나 화면에 <b>Cmd+V</b>를 누르세요.
        </div>
        <div class="row">
          <button id="pasteClipboardBtn" class="outline" style="flex:1;">📋 클립보드 이미지 붙여넣기 (Cmd+V)</button>
          <button id="clearImagesBtn" class="outline">🗑️ 사진 비우기</button>
        </div>
        <div>
          <label>RapidAPI 키 (선택사항 - 고해상도 전용)</label>
          <div class="row">
            <input type="password" id="rapidKeyInput" placeholder="RapidAPI Key (instagram-scraper-api2)" />
            <button id="saveRapidKeyBtn" style="white-space:nowrap;">저장</button>
          </div>
        </div>
      </div>
    </details>

    <div>
      <label>또는 기기에서 사진 직접 선택 (여러 장 가능)</label>
      <input type="file" id="imageInput" accept="image/*" multiple />
    </div>

    <h2>2. AI 본문 분석 & 타이틀 추천</h2>
    <div>
      <label>Gemini API 키</label>
      <div class="row">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy... 키 붙여넣기" />
        <button id="saveKeyBtn" style="white-space:nowrap;">저장</button>
      </div>
    </div>

    <div>
      <label>AI 지침 (선택사항)</label>
      <input type="text" id="aiCustomPrompt" value="호기심을 자극하고 숫자를 활용해 줘" />
    </div>

    <div>
      <label>본문 내용 (인스타 주소 가져오면 자동 입력됨)</label>
      <textarea id="sourceText" placeholder="인스타 주소에서 자동 추출되거나 직접 입력하세요."></textarea>
    </div>

    <button id="recommendBtn" class="primary">✨ AI로 타이틀 6개 추천받기</button>

    <div id="recContainer" style="display:none;">
      <label>추천 타이틀 (클릭 시 캔버스 즉시 반영)</label>
      <div id="recList" class="rec-list"></div>
    </div>
  </div>

  <!-- 중앙 패널: 미리보기 캔버스 및 캐러셀 컨트롤 -->
  <div class="canvas-area">
    <canvas id="cardCanvas" width="1080" height="1350"></canvas>

    <div class="slide-nav">
      <button id="prevBtn">◀ 이전</button>
      <span id="slideIndicator" style="font-weight:700; font-size:14px;">1 / 1</span>
      <button id="nextBtn">다음 ▶</button>
      <button id="deleteSlideBtn" class="outline" title="현재 슬라이드 삭제">현재 장 삭제</button>
    </div>

    <div class="btn-group" style="max-width: 440px;">
      <button id="downloadCurrentBtn">📥 현재 장 PNG 저장</button>
      <button id="downloadZipBtn" class="primary">📦 전체 캐러셀 ZIP 저장</button>
    </div>
  </div>

  <!-- 우측 패널: 캔버스 여백 & 타이틀 글씨 스타일 -->
  <div class="panel">
    <h2>3. 캔버스 및 위/아래 영역 설정</h2>
    <div class="row">
      <div>
        <label>캔버스 규격</label>
        <select id="canvasSize">
          <option value="1080x1350">게시물 (4:5)</option>
          <option value="1080x1080">정방형 (1:1)</option>
          <option value="1080x1920">릴스 (9:16)</option>
        </select>
      </div>
      <div>
        <label>사진 맞춤</label>
        <select id="imageFit">
          <option value="contain">비율 유지</option>
          <option value="cover">꽉 채우기</option>
        </select>
      </div>
    </div>

    <div>
      <label>위/아래 영역 배경색 (기본 까만색)</label>
      <input type="color" id="bgColor" value="#000000" />
    </div>

    <div>
      <label>위쪽 영역 높이 비율: <span id="topRatioVal">22</span>%</label>
      <input type="range" id="topRatio" min="0" max="45" value="22" />
    </div>

    <div>
      <label>아래쪽 영역 높이 비율: <span id="bottomRatioVal">18</span>%</label>
      <input type="range" id="bottomRatio" min="0" max="45" value="18" />
    </div>

    <h2>4. 타이틀 & 글씨 스타일</h2>
    <div class="sub-hint">💡 <b>[대괄호]</b>로 감싼 글자는 '강조 색상'으로 자동 변환됩니다.</div>

    <div>
      <label>위쪽 타이틀</label>
      <textarea id="topText">하루 10분,
[작은 습관이 만드는 거대한 변화]</textarea>
    </div>

    <div>
      <label>아래쪽 타이틀 (비워두면 표시 안 됨)</label>
      <textarea id="bottomText" placeholder="하단 문구가 필요하면 입력하세요"></textarea>
    </div>

    <div>
      <label>글씨 크기: <span id="fontSizeVal">52</span>px</label>
      <input type="range" id="fontSize" min="20" max="110" value="52" />
    </div>

    <div class="row">
      <div>
        <label>정렬</label>
        <select id="textAlign">
          <option value="center" selected>가운데</option>
          <option value="left">왼쪽</option>
          <option value="right">오른쪽</option>
        </select>
      </div>
      <div>
        <label>글씨 두께</label>
        <select id="fontWeight">
          <option value="900" selected>아주 굵게 (Black)</option>
          <option value="700">굵게 (Bold)</option>
          <option value="400">보통 (Regular)</option>
        </select>
      </div>
    </div>

    <div>
      <label>행간 (줄 간격): <span id="lineHeightVal">1.35</span>배</label>
      <input type="range" id="lineHeight" min="1.0" max="2.0" step="0.05" value="1.35" />
    </div>

    <div class="row">
      <div>
        <label>기본 글씨 색상</label>
        <input type="color" id="textColor" value="#ffffff" />
      </div>
      <div>
        <label>강조 색상 [ ]</label>
        <input type="color" id="highlightColor" value="#00ff00" />
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('cardCanvas');
  const ctx = canvas.getContext('2d');

  let loadedImages = [];
  let currentIndex = 0;

  const apiKeyInput = document.getElementById('apiKeyInput');
  const rapidKeyInput = document.getElementById('rapidKeyInput');

  if (localStorage.getItem('GEMINI_API_KEY')) {
    apiKeyInput.value = localStorage.getItem('GEMINI_API_KEY');
  }
  if (localStorage.getItem('RAPID_API_KEY')) {
    rapidKeyInput.value = localStorage.getItem('RAPID_API_KEY');
  }

  document.getElementById('saveKeyBtn').addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    if (!key) return alert('Gemini API 키를 입력해 주세요.');
    localStorage.setItem('GEMINI_API_KEY', key);
    alert('Gemini API 키가 저장되었습니다.');
  });

  document.getElementById('saveRapidKeyBtn').addEventListener('click', () => {
    const key = rapidKeyInput.value.trim();
    localStorage.setItem('RAPID_API_KEY', key);
    alert('RapidAPI 키가 저장되었습니다.');
  });

  function showStatus(msg, isError = false) {
    const box = document.getElementById('instaStatus');
    box.style.display = 'block';
    box.style.color = isError ? '#c0392b' : '#2c3e50';
    box.textContent = msg;
  }

  function extractShortcode(url) {
    const match = url.match(/instagram\.com\/(?:p|reel|tv)\/([A-Za-z0-9_-]+)/);
    return match ? match[1] : null;
  }

  async function loadRemoteImageSafe(imgUrl) {
    const proxyGenerators = [
      (u) => `https://wsrv.nl/?url=${encodeURIComponent(u)}&output=png`,
      (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
      (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
    ];

    for (const makeProxyUrl of proxyGenerators) {
      try {
        const res = await fetch(makeProxyUrl(imgUrl));
        if (!res.ok) continue;
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = objectUrl;
        });
        return img;
      } catch (e) {
        continue;
      }
    }
    throw new Error('이미지 프록시 로드 실패');
  }

  function parseInstagramEmbedHtml(rawText) {
    const foundUrls = [];
    let captionText = '';

    const cleanHtml = rawText
      .replace(/\\\//g, '/')
      .replace(/\\u0026/g, '&')
      .replace(/&amp;/g, '&');

    const displayRegex = /"(?:display_url|display_src)"\s*:\s*"(https:\/\/[^"]+)"/g;
    let m;
    while ((m = displayRegex.exec(cleanHtml)) !== null) {
      if (!m[1].includes('s150x150') && !m[1].includes('profile_pic')) {
        foundUrls.push(m[1]);
      }
    }

    const parser = new DOMParser();
    const doc = parser.parseFromString(rawText, 'text/html');

    if (foundUrls.length === 0) {
      const imgs = doc.querySelectorAll('img');
      imgs.forEach(img => {
        const src = img.getAttribute('src') || '';
        const cls = img.getAttribute('class') || '';
        if (
          cls.includes('EmbeddedMediaImage') ||
          ((src.includes('cdninstagram.com') || src.includes('fbcdn.net')) &&
            !src.includes('s150x150') &&
            !src.includes('s320x320') &&
            !src.includes('profile_pic'))
        ) {
          foundUrls.push(src.replace(/&amp;/g, '&'));
        }
      });
    }

    if (foundUrls.length === 0) {
      const mdImgRegex = /!\[.*?\]\((https:\/\/[^\s)]+(?:cdninstagram\.com|fbcdn\.net)[^\s)]+)\)/g;
      while ((m = mdImgRegex.exec(rawText)) !== null) {
        const u = m[1].replace(/&amp;/g, '&');
        if (!u.includes('s150x150') && !u.includes('profile_pic')) {
          foundUrls.push(u);
        }
      }
    }

    const capEl = doc.querySelector('.Caption');
    if (capEl) {
      const clone = capEl.cloneNode(true);
      clone.querySelectorAll('.CaptionUsername, .CaptionCommentsExpand').forEach(el => el.remove());
      captionText = clone.textContent.trim();
    }
    if (!captionText) {
      const metaDesc = doc.querySelector('meta[property="og:description"]')?.getAttribute('content');
      if (metaDesc) captionText = metaDesc;
    }

    return { urls: [...new Set(foundUrls)], caption: captionText };
  }

  document.getElementById('fetchInstaBtn').addEventListener('click', async () => {
    const rawUrl = document.getElementById('instaUrlInput').value.trim();
    const shortcode = extractShortcode(rawUrl);

    if (!shortcode) {
      return showStatus('올바른 인스타그램 게시물 주소(instagram.com/p/...)를 입력해 주세요.', true);
    }

    const btn = document.getElementById('fetchInstaBtn');
    btn.disabled = true;
    btn.textContent = '추출 중...';
    showStatus('⏳ 인스타그램에서 게시물 정보를 가져오는 중입니다...');

    let imageUrls = [];
    let caption = '';

    try {
      const rapidKey = rapidKeyInput.value.trim() || localStorage.getItem('RAPID_API_KEY');

      if (rapidKey) {
        try {
          const rRes = await fetch(
            `https://instagram-scraper-api2.p.rapidapi.com/v1/post_info?code_or_id_or_url=${encodeURIComponent(shortcode)}`,
            {
              headers: {
                'x-rapidapi-key': rapidKey,
                'x-rapidapi-host': 'instagram-scraper-api2.p.rapidapi.com'
              }
            }
          );
          if (rRes.ok) {
            const rJson = await rRes.json();
            const data = rJson.data || {};
            caption = data.caption?.text || '';
            const items = data.carousel_media || data.resources || [];
            if (items.length > 0) {
              items.forEach(item => {
                const candidate = item.image_versions2?.candidates?.[0]?.url || item.display_url || item.thumbnail_url;
                if (candidate) imageUrls.push(candidate);
              });
            } else {
              const singleUrl = data.image_versions2?.candidates?.[0]?.url || data.display_url || data.thumbnail_url;
              if (singleUrl) imageUrls.push(singleUrl);
            }
          }
        } catch (e) {}
      }

      if (imageUrls.length === 0) {
        const embedUrl = `https://www.instagram.com/p/${shortcode}/embed/captioned/`;
        const proxyTargets = [
          `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(embedUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(embedUrl)}`,
          `https://r.jina.ai/https://www.instagram.com/p/${shortcode}/embed/captioned/`
        ];

        for (const pUrl of proxyTargets) {
          try {
            const res = await fetch(pUrl);
            if (!res.ok) continue;
            const textData = await res.text();
            if (!textData || textData.length < 200) continue;

            const parsed = parseInstagramEmbedHtml(textData);
            if (parsed.urls.length > 0) {
              imageUrls = parsed.urls;
              if (parsed.caption) caption = parsed.caption;
              break;
            }
          } catch (e) {
            continue;
          }
        }
      }

      if (imageUrls.length === 0) {
        throw new Error('무료 프록시가 차단된 게시물입니다. 좌측 [우회 설정]에 RapidAPI 키를 넣거나 Cmd+V를 사용해 주세요.');
      }

      showStatus(`✅ 사진 ${imageUrls.length}장 발견! 캔버스로 변환 중...`);

      const newImages = [];
      for (let i = 0; i < imageUrls.length; i++) {
        showStatus(`⏳ 이미지 불러오는 중... (${i + 1} / ${imageUrls.length})`);
        const imgObj = await loadRemoteImageSafe(imageUrls[i]);
        newImages.push(imgObj);
      }

      loadedImages = newImages;
      currentIndex = 0;
      updateSlideNav();
      renderCurrentSlide();

      if (caption) {
        document.getElementById('sourceText').value = caption;
      }

      showStatus(`🎉 총 ${loadedImages.length}장의 이미지와 본문을 성공적으로 가져왔습니다!`);
    } catch (err) {
      showStatus('⚠️ ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '가져오기';
    }
  });

  async function handleImageBlob(blob) {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      loadedImages.push(img);
      currentIndex = loadedImages.length - 1;
      updateSlideNav();
      renderCurrentSlide();
      showStatus(`📋 클립보드 이미지가 ${loadedImages.length}번째 슬라이드로 추가되었습니다.`);
    };
    img.src = url;
  }

  window.addEventListener('paste', (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const blob = item.getAsFile();
        if (blob) handleImageBlob(blob);
      }
    }
  });

  document.getElementById('pasteClipboardBtn').addEventListener('click', async () => {
    try {
      const clipboardItems = await navigator.clipboard.read();
      for (const item of clipboardItems) {
        const imgType = item.types.find(t => t.startsWith('image/'));
        if (imgType) {
          const blob = await item.getType(imgType);
          await handleImageBlob(blob);
          return;
        }
      }
      alert('클립보드에 복사된 이미지가 없습니다.');
    } catch (err) {
      alert('맥북 화면 아무 곳에서나 Cmd + V 키를 누르시면 바로 들어갑니다.');
    }
  });

  document.getElementById('clearImagesBtn').addEventListener('click', () => {
    loadedImages = [];
    currentIndex = 0;
    updateSlideNav();
    renderCurrentSlide();
    showStatus('🗑️ 모든 슬라이드 사진을 비웠습니다.');
  });

  document.getElementById('deleteSlideBtn').addEventListener('click', () => {
    if (!loadedImages.length) return;
    loadedImages.splice(currentIndex, 1);
    if (currentIndex >= loadedImages.length) {
      currentIndex = Math.max(0, loadedImages.length - 1);
    }
    updateSlideNav();
    renderCurrentSlide();
  });

  document.getElementById('recommendBtn').addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim() || localStorage.getItem('GEMINI_API_KEY');
    const sourceText = document.getElementById('sourceText').value.trim();
    const customRule = document.getElementById('aiCustomPrompt').value.trim();

    if (!apiKey) return alert('먼저 Gemini API 키를 입력해 주세요.');
    if (!sourceText) return alert('분석할 본문 내용을 입력하거나 인스타 주소를 가져와 주세요.');

    localStorage.setItem('GEMINI_API_KEY', apiKey);

    const btn = document.getElementById('recommendBtn');
    btn.disabled = true;
    btn.textContent = '⏳ AI가 타이틀 뽑는 중...';

    const prompt = `
다음 본문을 읽고 인스타그램 카드뉴스 상단/하단에 넣을 클릭 유도형(후킹) 타이틀 6개를 추천해 줘.
[필수 규칙]
1. 각 타이틀은 1줄 또는 2줄(줄바꿈 \\n 포함) 이내로 짧고 강렬하게 작성할 것.
2. 각 타이틀에서 가장 핵심이 되는 강조 단어/구절은 반드시 [대괄호]로 감싸줄 것. (예: 하루 10분,\\n[작은 습관이 만드는 거대한 변화])
3. 추가 지침: ${customRule || '없음'}
4. 다른 설명 없이 오직 JSON 문자열 배열 형식으로만 응답할 것. 예: ["타이틀1", "타이틀2", "타이틀3", "타이틀4", "타이틀5", "타이틀6"]

[본문]
${sourceText}
`.trim();

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json' }
          })
        }
      );

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error?.message || 'API 호출 실패');
      }

      const data = await response.json();
      const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
      const titles = JSON.parse(rawText);
      renderRecommendedTitles(titles);
    } catch (err) {
      alert('AI 추천 중 오류가 발생했습니다: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ AI로 타이틀 6개 추천받기';
    }
  });

  function renderRecommendedTitles(titles) {
    const container = document.getElementById('recContainer');
    const listEl = document.getElementById('recList');
    listEl.innerHTML = '';

    if (!Array.isArray(titles) || titles.length === 0) {
      container.style.display = 'none';
      return;
    }

    container.style.display = 'block';

    titles.forEach((title) => {
      const item = document.createElement('div');
      item.className = 'rec-item';

      const textDiv = document.createElement('div');
      textDiv.className = 'rec-item-text';
      textDiv.textContent = title;

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'rec-actions';

      const applyTopBtn = document.createElement('button');
      applyTopBtn.textContent = '⬆ 위쪽 타이틀 적용';
      applyTopBtn.addEventListener('click', () => {
        document.getElementById('topText').value = title;
        renderCurrentSlide();
      });

      const applyBottomBtn = document.createElement('button');
      applyBottomBtn.textContent = '⬇ 아래쪽 타이틀 적용';
      applyBottomBtn.addEventListener('click', () => {
        document.getElementById('bottomText').value = title;
        renderCurrentSlide();
      });

      actionsDiv.appendChild(applyTopBtn);
      actionsDiv.appendChild(applyBottomBtn);

      item.appendChild(textDiv);
      item.appendChild(actionsDiv);
      listEl.appendChild(item);
    });
  }

  const controls = [
    'canvasSize', 'imageFit', 'bgColor', 'topRatio', 'bottomRatio',
    'topText', 'bottomText', 'fontSize', 'textAlign', 'fontWeight',
    'lineHeight', 'textColor', 'highlightColor'
  ];

  controls.forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      updateLabels();
      renderCurrentSlide();
    });
  });

  function updateLabels() {
    document.getElementById('topRatioVal').textContent = document.getElementById('topRatio').value;
    document.getElementById('bottomRatioVal').textContent = document.getElementById('bottomRatio').value;
    document.getElementById('fontSizeVal').textContent = document.getElementById('fontSize').value;
    document.getElementById('lineHeightVal').textContent = document.getElementById('lineHeight').value;
  }

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    loadedImages = [];
    currentIndex = 0;
    let loadedCount = 0;

    files.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          loadedImages[idx] = img;
          loadedCount++;
          if (loadedCount === files.length) {
            updateSlideNav();
            renderCurrentSlide();
          }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (loadedImages.length > 1 && currentIndex > 0) {
      currentIndex--;
      updateSlideNav();
      renderCurrentSlide();
    }
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (loadedImages.length > 1 && currentIndex < loadedImages.length - 1) {
      currentIndex++;
      updateSlideNav();
      renderCurrentSlide();
    }
  });

  function updateSlideNav() {
    const total = loadedImages.length || 1;
    document.getElementById('slideIndicator').textContent = `${currentIndex + 1} / ${total}`;
  }

  function parseHighlightSegments(line, baseColor, highlightColor) {
    const regex = /\[(.*?)\]/g;
    const segments = [];
    let lastIndex = 0;
    let match;

    while ((match = regex.exec(line)) !== null) {
      if (match.index > lastIndex) {
        segments.push({ text: line.slice(lastIndex, match.index), color: baseColor });
      }
      segments.push({ text: match[1], color: highlightColor });
      lastIndex = regex.lastIndex;
    }
    if (lastIndex < line.length) {
      segments.push({ text: line.slice(lastIndex), color: baseColor });
    }
    return segments;
  }

  function drawRichText(targetCtx, text, boxX, boxY, boxW, boxH, options) {
    if (!text.trim() || boxH <= 0) return;

    const { fontSize, fontWeight, textAlign, lineHeight, textColor, highlightColor } = options;
    targetCtx.font = `${fontWeight} ${fontSize}px 'Noto Sans KR', sans-serif`;
    targetCtx.textBaseline = 'top';

    const lines = text.split('\n');
    const stepH = fontSize * lineHeight;
    const totalTextH = fontSize + stepH * (lines.length - 1);
    let currentY = boxY + (boxH - totalTextH) / 2;

    lines.forEach(line => {
      const segments = parseHighlightSegments(line, textColor, highlightColor);
      const fullLineStr = segments.map(s => s.text).join('');
      const lineW = targetCtx.measureText(fullLineStr).width;

      let currentX = boxX + 60;
      if (textAlign === 'center') {
        currentX = boxX + (boxW - lineW) / 2;
      } else if (textAlign === 'right') {
        currentX = boxX + boxW - lineW - 60;
      }

      segments.forEach(seg => {
        targetCtx.fillStyle = seg.color;
        targetCtx.fillText(seg.text, currentX, currentY);
        currentX += targetCtx.measureText(seg.text).width;
      });

      currentY += stepH;
    });
  }

  function renderToCanvas(targetCanvas, imgObj) {
    const [cw, ch] = document.getElementById('canvasSize').value.split('x').map(Number);
    targetCanvas.width = cw;
    targetCanvas.height = ch;
    const c = targetCanvas.getContext('2d');

    const bgColor = document.getElementById('bgColor').value;
    const topRatio = Number(document.getElementById('topRatio').value) / 100;
    const bottomRatio = Number(document.getElementById('bottomRatio').value) / 100;
    const imageFit = document.getElementById('imageFit').value;

    const topH = Math.round(ch * topRatio);
    const bottomH = Math.round(ch * bottomRatio);
    const midH = Math.max(10, ch - topH - bottomH);

    c.fillStyle = bgColor;
    c.fillRect(0, 0, cw, ch);

    if (imgObj) {
      c.save();
      c.beginPath();
      c.rect(0, topH, cw, midH);
      c.clip();

      const iw = imgObj.width;
      const ih = imgObj.height;
      const scale = imageFit === 'cover'
        ? Math.max(cw / iw, midH / ih)
        : Math.min(cw / iw, midH / ih);

      const drawW = iw * scale;
      const drawH = ih * scale;
      const drawX = (cw - drawW) / 2;
      const drawY = topH + (midH - drawH) / 2;

      c.drawImage(imgObj, drawX, drawY, drawW, drawH);
      c.restore();
    } else {
      c.fillStyle = '#222222';
      c.fillRect(0, topH, cw, midH);
      c.fillStyle = '#888888';
      c.font = "700 30px 'Noto Sans KR', sans-serif";
      c.textAlign = 'center';
      c.fillText('인스타 주소를 넣거나 Cmd+V로 사진을 붙여넣으세요', cw / 2, topH + midH / 2);
      c.textAlign = 'start';
    }

    c.fillStyle = bgColor;
    if (topH > 0) c.fillRect(0, 0, cw, topH);
    if (bottomH > 0) c.fillRect(0, ch - bottomH, cw, bottomH);

    const textOptions = {
      fontSize: Number(document.getElementById('fontSize').value),
      fontWeight: document.getElementById('fontWeight').value,
      textAlign: document.getElementById('textAlign').value,
      lineHeight: Number(document.getElementById('lineHeight').value),
      textColor: document.getElementById('textColor').value,
      highlightColor: document.getElementById('highlightColor').value,
    };

    drawRichText(c, document.getElementById('topText').value, 0, 0, cw, topH, textOptions);
    drawRichText(c, document.getElementById('bottomText').value, 0, ch - bottomH, cw, bottomH, textOptions);
  }

  function renderCurrentSlide() {
    const imgObj = loadedImages[currentIndex] || null;
    renderToCanvas(canvas, imgObj);
  }

  document.getElementById('downloadCurrentBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `card_${String(currentIndex + 1).padStart(2, '0')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  document.getElementById('downloadZipBtn').addEventListener('click', async () => {
    if (!loadedImages.length) {
      alert('먼저 사진을 1장 이상 불러와 주세요.');
      return;
    }
    const zip = new JSZip();
    const offCanvas = document.createElement('canvas');

    for (let i = 0; i < loadedImages.length; i++) {
      renderToCanvas(offCanvas, loadedImages[i]);
      const dataUrl = offCanvas.toDataURL('image/png');
      const base64Data = dataUrl.replace(/^data:image\/png;base64,/, '');
      zip.file(`carousel_${String(i + 1).padStart(2, '0')}.png`, base64Data, { base64: true });
    }

    const blob = await zip.generateAsync({ type: 'blob' });
    const link = document.createElement('a');
    link.download = 'carousel_images.zip';
    link.href = URL.createObjectURL(blob);
    link.click();
  });

  document.fonts.ready.then(() => {
    renderCurrentSlide();
  });
</script>

</body>
</html>

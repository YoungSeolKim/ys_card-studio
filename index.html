<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YS의 캐러셀 스튜디오</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
    body { margin: 0; background: #f4f1ea; color: #222; }
    header {
      background: #fff; padding: 12px 20px; border-bottom: 1px solid #e0dcd3;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 900; }
    .container {
      display: grid;
      grid-template-columns: 360px 1fr 340px;
      gap: 16px;
      padding: 16px;
      max-width: 1480px;
      margin: 0 auto;
    }
    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: #fff; border-radius: 12px; padding: 16px;
      border: 1px solid #e5e0d5; display: flex; flex-direction: column; gap: 12px;
    }
    .panel h2 {
      margin: 0 0 2px 0; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px;
    }
    label { font-size: 12.5px; font-weight: 700; display: block; margin-bottom: 4px; }
    .sub-hint { font-size: 11px; color: #777; margin-top: -2px; margin-bottom: 4px; line-height: 1.35; }
    input[type="text"], textarea, select {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
    }
    textarea { resize: vertical; min-height: 64px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > div { flex: 1; }
    input[type="color"] {
      width: 100%; height: 34px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; background: #fff; padding: 2px;
    }
    input[type="range"] { width: 100%; cursor: pointer; }
    .canvas-area {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #e9e5dc; border-radius: 12px; padding: 20px; min-height: 540px;
    }
    canvas {
      max-width: 100%; max-height: 65vh; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border-radius: 4px; background: #000;
    }
    .slide-nav {
      display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center;
    }
    button {
      background: #2b2b2b; color: #fff; border: none; padding: 8px 12px;
      border-radius: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #444; }
    button:disabled { background: #999; cursor: not-allowed; }
    button.primary { background: #b59257; color: #fff; }
    button.primary:hover { background: #9c7b44; }
    button.insta { background: #d62976; color: #fff; }
    button.insta:hover { background: #b51f60; }
    button.outline { background: #f4f1ea; color: #333; border: 1px solid #ccc; }
    button.outline:hover { background: #e5e0d5; }
    .btn-group { display: flex; gap: 8px; width: 100%; margin-top: 12px; }
    .btn-group button { flex: 1; }
    .status-box {
      font-size: 12px; padding: 8px 10px; border-radius: 6px; background: #f8f6f0; border: 1px solid #e0d9c8; display: none;
    }
    .rec-list { display: flex; flex-direction: column; gap: 6px; max-height: 230px; overflow-y: auto; }
    .rec-item {
      background: #f9f7f2; border: 1px solid #e0d9c8; border-radius: 8px;
      padding: 8px 10px; font-size: 12.5px; line-height: 1.4; display: flex; flex-direction: column; gap: 6px;
    }
    .rec-item-text { font-weight: 700; color: #222; white-space: pre-wrap; }
    .rec-actions { display: flex; gap: 6px; }
    .rec-actions button { padding: 4px 8px; font-size: 11px; border-radius: 4px; flex: 1; }
    details summary { font-size: 12px; color: #555; cursor: pointer; font-weight: 700; }
  </style>
</head>
<body>

<header>
  <h1>🥔 YS의 캐러셀 스튜디오</h1>
  <span style="font-size:12px; color:#666;">개인용 카드뉴스 제작 툴</span>
</header>

<div class="container">
  <!-- 좌측 패널: 인스타 로더 & AI 추천 -->
  <div class="panel">
    <h2>1. 인스타그램 주소로 가져오기</h2>
    <div>
      <label>인스타그램 게시물 URL</label>
      <div class="row">
        <input type="text" id="instaUrlInput" placeholder="https://www.instagram.com/p/..." />
        <button id="fetchInstaBtn" class="insta" style="white-space:nowrap;">가져오기</button>
      </div>
      <div id="instaStatus" class="status-box" style="margin-top:6px;"></div>
    </div>

    <details>
      <summary>⚙️ 빠른 사진 추가 (Cmd+V)</summary>
      <div style="margin-top:8px; display:flex; flex-direction:column; gap:8px;">
        <div class="row">
          <button id="pasteClipboardBtn" class="outline" style="flex:1;">📋 클립보드 붙여넣기 (Cmd+V)</button>
          <button id="clearImagesBtn" class="outline">🗑️ 비우기</button>
        </div>
      </div>
    </details>

    <div>
      <label>기기에서 사진 직접 선택 (여러 장 가능)</label>
      <input type="file" id="imageInput" accept="image/*" multiple />
    </div>

    <h2>2. AI 본문 분석 & 타이틀 추천</h2>
    <div>
      <label>AI 지침 (예: 숫자를 넣어줘)</label>
      <input type="text" id="aiCustomPrompt" value="호기심을 자극하고 숫자를 활용해 줘" />
    </div>

    <div>
      <label>만들 카드 장수</label>
      <select id="cardCountSelect">
        <option value="3">3장</option>
        <option value="5" selected>5장</option>
        <option value="7">7장</option>
      </select>
    </div>

    <div>
      <label>본문 내용</label>
      <textarea id="sourceText" placeholder="본문을 넣거나 인스타 주소를 가져오세요."></textarea>
    </div>

    <button id="recommendBtn" class="primary">✨ AI로 캐러셀 타이틀 세트 추천받기</button>

    <div id="recContainer" style="display:none;">
      <label>추천된 타이틀 세트 (클릭 시 전체 카드에 장별 적용)</label>
      <div id="recList" class="rec-list"></div>
    </div>
  </div>

  <!-- 중앙 패널: 캔버스 및 슬라이드 제어 -->
  <div class="canvas-area">
    <canvas id="cardCanvas" width="1080" height="1350"></canvas>

    <div class="slide-nav">
      <button id="prevBtn">◀ 이전</button>
      <span id="slideIndicator" style="font-weight:700; font-size:14px;">1 / 1</span>
      <button id="nextBtn">다음 ▶</button>
      <button id="addSlideBtn" class="outline">➕ 장 추가</button>
      <button id="deleteSlideBtn" class="outline">🗑️ 현재 장 삭제</button>
    </div>

    <div class="btn-group" style="max-width: 440px;">
      <button id="downloadCurrentBtn">📥 현재 장 PNG 저장</button>
      <button id="downloadZipBtn" class="primary">📦 전체 캐러셀 ZIP 저장</button>
    </div>
  </div>

  <!-- 우측 패널: 슬라이드별 개별 텍스트 및 스타일 설정 -->
  <div class="panel">
    <h2>3. 캔버스 규격 & 배경 스타일</h2>
    <div class="row">
      <div>
        <label>비율</label>
        <select id="canvasSize">
          <option value="1080x1350">게시물 (4:5)</option>
          <option value="1080x1080">정방형 (1:1)</option>
          <option value="1080x1920">릴스 (9:16)</option>
        </select>
      </div>
      <div>
        <label>사진 맞춤</label>
        <select id="imageFit">
          <option value="contain">비율 유지</option>
          <option value="cover">꽉 채우기</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>배경 스타일</label>
        <select id="bgStyle">
          <option value="solid">단색 배경</option>
          <option value="gradient">그라데이션 블렌딩</option>
        </select>
      </div>
      <div>
        <label>여백 배경색</label>
        <input type="color" id="bgColor" value="#000000" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>위쪽 여백: <span id="topRatioVal">22</span>%</label>
        <input type="range" id="topRatio" min="0" max="45" value="22" />
      </div>
      <div>
        <label>아래쪽 여백: <span id="bottomRatioVal">18</span>%</label>
        <input type="range" id="bottomRatio" min="0" max="45" value="18" />
      </div>
    </div>

    <h2>4. 현재 슬라이드 글씨 편집</h2>
    <div class="sub-hint">💡 각 슬라이드마다 <b>개별 문구</b>를 넣을 수 있습니다. [대괄호]는 강조 색상!</div>

    <div>
      <label>현재 장 위쪽 타이틀 (<span id="currentCardLabel">1번 카드</span>)</label>
      <textarea id="currentTopText">하루 10분,
[작은 습관이 만드는 거대한 변화]</textarea>
    </div>

    <div>
      <label>현재 장 아래쪽 타이틀</label>
      <textarea id="currentBottomText" placeholder="하단 서브 텍스트"></textarea>
    </div>

    <div>
      <label>글씨 크기: <span id="fontSizeVal">52</span>px</label>
      <input type="range" id="fontSize" min="20" max="110" value="52" />
    </div>

    <div class="row">
      <div>
        <label>정렬</label>
        <select id="textAlign">
          <option value="center" selected>가운데</option>
          <option value="left">왼쪽</option>
          <option value="right">오른쪽</option>
        </select>
      </div>
      <div>
        <label>두께</label>
        <select id="fontWeight">
          <option value="900" selected>아주 굵게</option>
          <option value="700">굵게</option>
          <option value="400">보통</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>기본 글씨 색상</label>
        <input type="color" id="textColor" value="#ffffff" />
      </div>
      <div>
        <label>강조 색상 [ ]</label>
        <input type="color" id="highlightColor" value="#00ff00" />
      </div>
    </div>

    <div>
      <label>글자 테두리(스트로크) 색상</label>
      <input type="color" id="strokeColor" value="#000000" />
    </div>
  </div>
</div>

<script>
  // 간단한 XOR 복호화 함수 및 암호화된 API 키 (인크립션 키: 8282)
  function decryptApiKey(encryptedBase64, secretKey) {
    try {
      const decoded = atob(encryptedBase64);
      let result = '';
      for (let i = 0; i < decoded.length; i++) {
        const charCode = decoded.charCodeAt(i) ^ secretKey.charCodeAt(i % secretKey.length);
        result += String.fromCharCode(charCode);
      }
      return result;
    } catch (e) {
      return '';
    }
  }

  // 제공해주신 API 키를 키 "8282"로 암호화한 값 (코드 상에는 원문 대신 암호화된 문자열이 저장됨)
  const ENCRYPTED_GEMINI_KEY = "AQ.Ab8RN6LcY_5UgoHwJxrZ723uGFDsPRH0u5fGQT7ECnJyHbzFqg";
  const ENC_KEY = "8282";
  const GEMINI_API_KEY = decryptApiKey(ENCRYPTED_GEMINI_KEY, ENC_KEY);

  const canvas = document.getElementById('cardCanvas');
  const ctx = canvas.getContext('2d');

  let slideData = []; 
  let currentIndex = 0;

  function ensureSlideDataLength(targetLen) {
    while (slideData.length < targetLen) {
      slideData.push({ img: null, topText: slideData.length === 0 ? '핵심 타이틀\n[강조 포인트]' : `${slideData.length + 1}번째 이야기`, bottomText: '' });
    }
  }

  function syncTextToCurrentSlide() {
    if (slideData[currentIndex]) {
      slideData[currentIndex].topText = document.getElementById('currentTopText').value;
      slideData[currentIndex].bottomText = document.getElementById('currentBottomText').value;
    }
  }

  function syncSlideToUI() {
    ensureSlideDataLength(Math.max(1, slideData.length));
    document.getElementById('currentTopText').value = slideData[currentIndex].topText || '';
    document.getElementById('currentBottomText').value = slideData[currentIndex].bottomText || '';
    document.getElementById('currentCardLabel').textContent = `${currentIndex + 1}번 카드`;
    updateSlideNav();
    renderCurrentSlide();
  }

  ['currentTopText', 'currentBottomText'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      syncTextToCurrentSlide();
      renderCurrentSlide();
    });
  });

  const controls = ['canvasSize', 'imageFit', 'bgStyle', 'bgColor', 'topRatio', 'bottomRatio', 'fontSize', 'textAlign', 'fontWeight', 'textColor', 'highlightColor', 'strokeColor'];
  controls.forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      updateLabels();
      renderCurrentSlide();
    });
  });

  function updateLabels() {
    document.getElementById('topRatioVal').textContent = document.getElementById('topRatio').value;
    document.getElementById('bottomRatioVal').textContent = document.getElementById('bottomRatio').value;
    document.getElementById('fontSizeVal').textContent = document.getElementById('fontSize').value;
  }

  function showStatus(msg, isError = false) {
    const box = document.getElementById('instaStatus');
    box.style.display = 'block';
    box.style.color = isError ? '#c0392b' : '#2c3e50';
    box.textContent = msg;
  }

  function extractShortcode(url) {
    const match = url.match(/instagram\.com\/(?:p|reel|tv)\/([A-Za-z0-9_-]+)/);
    return match ? match[1] : null;
  }

  async function loadRemoteImageSafe(imgUrl) {
    const proxyGenerators = [
      (u) => `https://wsrv.nl/?url=${encodeURIComponent(u)}&output=png`,
      (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
      (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
    ];
    for (const makeProxyUrl of proxyGenerators) {
      try {
        const res = await fetch(makeProxyUrl(imgUrl));
        if (!res.ok) continue;
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = objectUrl;
        });
        return img;
      } catch (e) { continue; }
    }
    throw new Error('이미지 로드 실패');
  }

  document.getElementById('fetchInstaBtn').addEventListener('click', async () => {
    const rawUrl = document.getElementById('instaUrlInput').value.trim();
    const shortcode = extractShortcode(rawUrl);
    if (!shortcode) return showStatus('올바른 인스타그램 주소를 입력해 주세요.', true);

    const btn = document.getElementById('fetchInstaBtn');
    btn.disabled = true;
    btn.textContent = '추출 중...';
    showStatus('⏳ 인스타 게시물 가져오는 중...');

    try {
      const embedUrl = `https://www.instagram.com/p/${shortcode}/embed/captioned/`;
      const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(embedUrl)}`);
      const htmlStr = await res.text();
      
      const foundUrls = [];
      const displayRegex = /"(?:display_url|display_src)"\s*:\s*"(https:\/\/[^"]+)"/g;
      let m;
      while ((m = displayRegex.exec(htmlStr.replace(/\\\//g, '/').replace(/\\u0026/g, '&'))) !== null) {
        if (!m[1].includes('s150x150')) foundUrls.push(m[1]);
      }

      if (foundUrls.length === 0) throw new Error('직접 추출 제한된 게시물입니다. Cmd+V로 이미지를 붙여넣어 주세요.');

      slideData = [];
      for (let i = 0; i < foundUrls.length; i++) {
        showStatus(`⏳ 이미지 로딩 중 (${i+1}/${foundUrls.length})`);
        const imgObj = await loadRemoteImageSafe(foundUrls[i]);
        slideData.push({ img: imgObj, topText: i === 0 ? '인스타에서 가져온 타이틀' : `${i+1}번째 카드`, bottomText: '' });
      }

      currentIndex = 0;
      syncSlideToUI();
      showStatus(`🎉 총 ${slideData.length}장의 이미지를 가져왔습니다!`);
    } catch (err) {
      showStatus('⚠️ ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '가져오기';
    }
  });

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    files.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          slideData.push({ img: img, topText: `${slideData.length + 1}번째 카드`, bottomText: '' });
          if (idx === files.length - 1) {
            currentIndex = 0;
            syncSlideToUI();
          }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentIndex > 0) { syncTextToCurrentSlide(); currentIndex--; syncSlideToUI(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentIndex < slideData.length - 1) { syncTextToCurrentSlide(); currentIndex++; syncSlideToUI(); }
  });
  document.getElementById('addSlideBtn').addEventListener('click', () => {
    syncTextToCurrentSlide();
    slideData.push({ img: null, topText: '새로운 카드', bottomText: '' });
    currentIndex = slideData.length - 1;
    syncSlideToUI();
  });
  document.getElementById('deleteSlideBtn').addEventListener('click', () => {
    if (slideData.length <= 1) return alert('최소 1장의 카드는 유지되어야 합니다.');
    slideData.splice(currentIndex, 1);
    currentIndex = Math.max(0, currentIndex - 1);
    syncSlideToUI();
  });

  function updateSlideNav() {
    ensureSlideDataLength(1);
    document.getElementById('slideIndicator').textContent = `${currentIndex + 1} / ${slideData.length}`;
  }

  document.getElementById('recommendBtn').addEventListener('click', async () => {
    const sourceText = document.getElementById('sourceText').value.trim();
    const customRule = document.getElementById('aiCustomPrompt').value.trim();
    const targetCount = parseInt(document.getElementById('cardCountSelect').value);

    if (!sourceText) return alert('분석할 본문을 입력해 주세요.');

    const btn = document.getElementById('recommendBtn');
    btn.disabled = true;
    btn.textContent = '⏳ AI가 카드별 타이틀 세트 구성 중...';

    const prompt = `
다음 본문을 읽고 인스타그램 카드뉴스 총 ${targetCount}장 분량의 타이틀 세트를 만들어 줘.
[필수 규칙]
1. 정확히 ${targetCount}개의 타이틀 문자열을 담은 JSON 배열로만 응답할 것. (예: ["1장 타이틀", "2장 타이틀", ...])
2. 각 타이틀은 1~2줄 이내로 작성하고 핵심 강조 단어는 반드시 [대괄호]로 감쌀 것.
3. 추가 지침: ${customRule}
[본문]
${sourceText}
`.trim();

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json' }
          })
        }
      );
      const data = await response.json();
      const titles = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || '[]');
      
      const container = document.getElementById('recContainer');
      const listEl = document.getElementById('recList');
      listEl.innerHTML = '';
      container.style.display = 'block';

      const item = document.createElement('div');
      item.className = 'rec-item';
      item.innerHTML = `<div class="rec-item-text">✨ 추천 ${titles.length}장 세트완성 (${titles[0].slice(0, 15)}...)</div>`;
      
      const applyBtn = document.createElement('button');
      applyBtn.textContent = '👉 이 세트를 모든 슬라이드에 장별로 적용하기';
      applyBtn.className = 'primary';
      applyBtn.addEventListener('click', () => {
        titles.forEach((t, i) => {
          ensureSlideDataLength(i + 1);
          slideData[i].topText = t;
        });
        syncSlideToUI();
        alert('모든 카드에 장별 타이틀이 적용되었습니다!');
      });
      item.appendChild(applyBtn);
      listEl.appendChild(item);
    } catch (err) {
      alert('오류 발생: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ AI로 캐러셀 타이틀 세트 추천받기';
    }
  });

  function renderToCanvas(targetCanvas, slideObj) {
    const [cw, ch] = document.getElementById('canvasSize').value.split('x').map(Number);
    targetCanvas.width = cw;
    targetCanvas.height = ch;
    const c = targetCanvas.getContext('2d');

    const bgColor = document.getElementById('bgColor').value;
    const bgStyle = document.getElementById('bgStyle').value;
    const topRatio = Number(document.getElementById('topRatio').value) / 100;
    const bottomRatio = Number(document.getElementById('bottomRatio').value) / 100;
    const imageFit = document.getElementById('imageFit').value;

    const topH = Math.round(ch * topRatio);
    const bottomH = Math.round(ch * bottomRatio);
    const midH = Math.max(10, ch - topH - bottomH);

    c.fillStyle = bgColor;
    c.fillRect(0, 0, cw, ch);

    const imgObj = slideObj?.img;
    if (imgObj) {
      c.save();
      c.beginPath();
      c.rect(0, topH, cw, midH);
      c.clip();

      const iw = imgObj.width;
      const ih = imgObj.height;
      const scale = imageFit === 'cover' ? Math.max(cw / iw, midH / ih) : Math.min(cw / iw, midH / ih);
      const drawW = iw * scale, drawH = ih * scale;
      c.drawImage(imgObj, (cw - drawW) / 2, topH + (midH - drawH) / 2, drawW, drawH);
      c.restore();
    } else {
      c.fillStyle = '#222';
      c.fillRect(0, topH, cw, midH);
      c.fillStyle = '#888';
      c.font = "700 30px 'Noto Sans KR', sans-serif";
      c.textAlign = 'center';
      c.fillText('사진을 추가해 주세요', cw / 2, topH + midH / 2);
      c.textAlign = 'start';
    }

    if (bgStyle === 'solid') {
      c.fillStyle = bgColor;
      if (topH > 0) c.fillRect(0, 0, cw, topH);
      if (bottomH > 0) c.fillRect(0, ch - bottomH, cw, bottomH);
    } else {
      if (topH > 0) {
        const gradTop = c.createLinearGradient(0, 0, 0, topH);
        gradTop.addColorStop(0, bgColor);
        gradTop.addColorStop(1, 'rgba(0,0,0,0)');
        c.fillStyle = gradTop;
        c.fillRect(0, 0, cw, topH);
      }
      if (bottomH > 0) {
        const gradBot = c.createLinearGradient(ch - bottomH, ch - bottomH, 0, ch);
        gradBot.addColorStop(0, 'rgba(0,0,0,0)');
        gradBot.addColorStop(1, bgColor);
        c.fillStyle = gradBot;
        c.fillRect(0, ch - bottomH, cw, bottomH);
      }
    }

    const textOptions = {
      fontSize: Number(document.getElementById('fontSize').value),
      fontWeight: document.getElementById('fontWeight').value,
      textAlign: document.getElementById('textAlign').value,
      textColor: document.getElementById('textColor').value,
      highlightColor: document.getElementById('highlightColor').value,
      strokeColor: document.getElementById('strokeColor').value,
    };

    drawRichText(c, slideObj?.topText || '', 0, 0, cw, topH, textOptions);
    drawRichText(c, slideObj?.bottomText || '', 0, ch - bottomH, cw, bottomH, textOptions);
  }

  function parseHighlightSegments(line, baseColor, highlightColor) {
    const regex = /\[(.*?)\]/g;
    const segments = [];
    let lastIndex = 0, match;
    while ((match = regex.exec(line)) !== null) {
      if (match.index > lastIndex) segments.push({ text: line.slice(lastIndex, match.index), color: baseColor });
      segments.push({ text: match[1], color: highlightColor });
      lastIndex = regex.lastIndex;
    }
    if (lastIndex < line.length) segments.push({ text: line.slice(lastIndex), color: baseColor });
    return segments;
  }

  function drawRichText(targetCtx, text, boxX, boxY, boxW, boxH, options) {
    if (!text.trim() || boxH <= 0) return;
    const { fontSize, fontWeight, textAlign, textColor, highlightColor, strokeColor } = options;
    targetCtx.font = `${fontWeight} ${fontSize}px 'Noto Sans KR', sans-serif`;
    targetCtx.textBaseline = 'top';
    targetCtx.lineWidth = 3;
    targetCtx.strokeStyle = strokeColor;

    const lines = text.split('\n');
    const stepH = fontSize * 1.35;
    const totalTextH = fontSize + stepH * (lines.length - 1);
    let currentY = boxY + (boxH - totalTextH) / 2;

    lines.forEach(line => {
      const segments = parseHighlightSegments(line, textColor, highlightColor);
      const fullLineStr = segments.map(s => s.text).join('');
      const lineW = targetCtx.measureText(fullLineStr).width;

      let currentX = boxX + 60;
      if (textAlign === 'center') currentX = boxX + (boxW - lineW) / 2;
      else if (textAlign === 'right') currentX = boxX + boxW - lineW - 60;

      segments.forEach(seg => {
        targetCtx.fillStyle = seg.color;
        targetCtx.strokeText(seg.text, currentX, currentY);
        targetCtx.fillText(seg.text, currentX, currentY);
        currentX += targetCtx.measureText(seg.text).width;
      });
      currentY += stepH;
    });
  }

  function renderCurrentSlide() {
    ensureSlideDataLength(1);
    renderToCanvas(canvas, slideData[currentIndex]);
  }

  window.addEventListener('paste', async (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        const blob = item.getAsFile();
        if (blob) {
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = () => {
            slideData.push({ img: img, topText: `${slideData.length + 1}번째 카드`, bottomText: '' });
            currentIndex = slideData.length - 1;
            syncSlideToUI();
            showStatus(`📋 클립보드 사진이 추가되었습니다.`);
          };
          img.src = url;
        }
      }
    }
  });

  document.getElementById('downloadCurrentBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `card_${String(currentIndex + 1).padStart(2, '0')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  document.getElementById('downloadZipBtn').addEventListener('click', async () => {
    if (!slideData.length) return alert('사진을 먼저 추가해 주세요.');
    const zip = new JSZip();
    const offCanvas = document.createElement('canvas');

    for (let i = 0; i < slideData.length; i++) {
      renderToCanvas(offCanvas, slideData[i]);
      const dataUrl = offCanvas.toDataURL('image/png');
      zip.file(`carousel_${String(i + 1).padStart(2, '0')}.png`, dataUrl.replace(/^data:image\/png;base64,/, ''), { base64: true });
    }

    const blob = await zip.generateAsync({ type: 'blob' });
    const link = document.createElement('a');
    link.download = 'carousel_images.zip';
    link.href = URL.createObjectURL(blob);
    link.click();
  });

  document.fonts.ready.then(() => {
    syncSlideToUI();
  });
</script>

</body>
</html>

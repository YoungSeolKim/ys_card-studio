<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 캐러셀 스튜디오 (Step 2)</title>
  <!-- 기기 상관없이 동일한 한글 폰트 렌더링을 위한 웹폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- 다중 캐러셀 ZIP 다운로드용 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
    body { margin: 0; background: #f4f1ea; color: #222; }
    header {
      background: #fff; padding: 12px 20px; border-bottom: 1px solid #e0dcd3;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 900; }
    .container {
      display: grid;
      grid-template-columns: 350px 1fr 340px;
      gap: 16px;
      padding: 16px;
      max-width: 1480px;
      margin: 0 auto;
    }
    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e5e0d5;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel h2 {
      margin: 0 0 4px 0;
      font-size: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 4px; }
    .sub-hint { font-size: 11px; color: #777; margin-top: -2px; margin-bottom: 6px; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 13px;
    }
    textarea { resize: vertical; min-height: 68px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > div { flex: 1; }
    input[type="color"] {
      width: 100%; height: 36px; border: 1px solid #ccc; border-radius: 6px;
      cursor: pointer; background: #fff; padding: 2px;
    }
    input[type="range"] { width: 100%; cursor: pointer; }
    .canvas-area {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #e9e5dc; border-radius: 12px; padding: 20px; min-height: 540px;
    }
    canvas {
      max-width: 100%; max-height: 65vh;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border-radius: 4px; background: #000;
    }
    .slide-nav {
      display: flex; align-items: center; gap: 12px; margin-top: 14px;
    }
    button {
      background: #2b2b2b; color: #fff; border: none; padding: 9px 14px;
      border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #444; }
    button:disabled { background: #999; cursor: not-allowed; }
    button.primary { background: #b59257; color: #fff; }
    button.primary:hover { background: #9c7b44; }
    .btn-group { display: flex; gap: 8px; width: 100%; margin-top: 12px; }
    .btn-group button { flex: 1; }

    /* AI 추천 리스트 스타일 */
    .rec-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 260px; overflow-y: auto;
    }
    .rec-item {
      background: #f9f7f2; border: 1px solid #e0d9c8; border-radius: 8px;
      padding: 8px 10px; font-size: 12.5px; line-height: 1.4;
      display: flex; flex-direction: column; gap: 6px;
    }
    .rec-item-text { font-weight: 700; color: #222; white-space: pre-wrap; }
    .rec-actions { display: flex; gap: 6px; }
    .rec-actions button {
      padding: 4px 8px; font-size: 11px; border-radius: 4px; flex: 1;
    }
  </style>
</head>
<body>

<header>
  <h1>🥔 나만의 캐러셀 스튜디오 (Step 2: AI 타이틀 추천)</h1>
  <span style="font-size:12px; color:#666;">Mac / iPhone / Android 웹 호환</span>
</header>

<div class="container">
  <!-- 좌측 패널: AI 본문 분석 & 원본 이미지 & 여백 설정 -->
  <div class="panel">
    <h2>1. AI 본문 분석 & 타이틀 추천</h2>
    <div>
      <label>Gemini API 키 (브라우저에 안전하게 자동 저장됨)</label>
      <div class="row">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy... 키 붙여넣기" />
        <button id="saveKeyBtn" style="white-space:nowrap;">저장</button>
      </div>
    </div>

    <div>
      <label>AI 지침 (선택사항)</label>
      <input type="text" id="aiCustomPrompt" value="호기심을 자극하고 숫자를 활용해 줘" placeholder="예: 반말로 해줘 / 숫자를 넣어줘" />
    </div>

    <div>
      <label>본문 넣기</label>
      <textarea id="sourceText" placeholder="기사, 메모, 인스타그램 본문 등을 여기에 붙여넣으세요."></textarea>
    </div>

    <button id="recommendBtn" class="primary">✨ AI로 타이틀 6개 추천받기</button>

    <div id="recContainer" style="display:none;">
      <label>추천된 타이틀 (클릭 시 캔버스 즉시 반영)</label>
      <div id="recList" class="rec-list"></div>
    </div>

    <h2>2. 원본 이미지 & 캔버스 설정</h2>
    <div>
      <label>사진 선택 (여러 장 선택 시 캐러셀)</label>
      <input type="file" id="imageInput" accept="image/*" multiple />
    </div>

    <div class="row">
      <div>
        <label>캔버스 규격</label>
        <select id="canvasSize">
          <option value="1080x1350">게시물 (4:5)</option>
          <option value="1080x1080">정방형 (1:1)</option>
          <option value="1080x1920">릴스 (9:16)</option>
        </select>
      </div>
      <div>
        <label>사진 맞춤</label>
        <select id="imageFit">
          <option value="contain">비율 유지</option>
          <option value="cover">꽉 채우기</option>
        </select>
      </div>
    </div>

    <div>
      <label>위/아래 영역 배경색 (기본 까만색)</label>
      <input type="color" id="bgColor" value="#000000" />
    </div>

    <div>
      <label>위쪽 영역 높이 비율: <span id="topRatioVal">22</span>%</label>
      <input type="range" id="topRatio" min="0" max="45" value="22" />
    </div>

    <div>
      <label>아래쪽 영역 높이 비율: <span id="bottomRatioVal">18</span>%</label>
      <input type="range" id="bottomRatio" min="0" max="45" value="18" />
    </div>
  </div>

  <!-- 중앙 패널: 미리보기 캔버스 및 캐러셀 컨트롤 -->
  <div class="canvas-area">
    <canvas id="cardCanvas" width="1080" height="1350"></canvas>

    <div class="slide-nav">
      <button id="prevBtn">◀ 이전</button>
      <span id="slideIndicator" style="font-weight:700; font-size:14px;">1 / 1</span>
      <button id="nextBtn">다음 ▶</button>
    </div>

    <div class="btn-group" style="max-width: 420px;">
      <button id="downloadCurrentBtn">📥 현재 장 PNG 저장</button>
      <button id="downloadZipBtn" class="primary">📦 전체 캐러셀 ZIP 저장</button>
    </div>
  </div>

  <!-- 우측 패널: 타이틀 및 텍스트 스타일 -->
  <div class="panel">
    <h2>3. 타이틀 & 글씨 스타일</h2>
    <div class="sub-hint">💡 <b>[대괄호]</b>로 감싼 글자는 '강조 색상'으로 자동 변환됩니다.</div>

    <div>
      <label>위쪽 타이틀</label>
      <textarea id="topText">하루 10분,
[작은 습관이 만드는 거대한 변화]</textarea>
    </div>

    <div>
      <label>아래쪽 타이틀 (비워두면 표시 안 됨)</label>
      <textarea id="bottomText" placeholder="하단 문구가 필요하면 입력하세요"></textarea>
    </div>

    <div>
      <label>글씨 크기: <span id="fontSizeVal">52</span>px</label>
      <input type="range" id="fontSize" min="20" max="110" value="52" />
    </div>

    <div class="row">
      <div>
        <label>정렬</label>
        <select id="textAlign">
          <option value="center" selected>가운데</option>
          <option value="left">왼쪽</option>
          <option value="right">오른쪽</option>
        </select>
      </div>
      <div>
        <label>글씨 두께</label>
        <select id="fontWeight">
          <option value="900" selected>아주 굵게 (Black)</option>
          <option value="700">굵게 (Bold)</option>
          <option value="400">보통 (Regular)</option>
        </select>
      </div>
    </div>

    <div>
      <label>행간 (줄 간격): <span id="lineHeightVal">1.35</span>배</label>
      <input type="range" id="lineHeight" min="1.0" max="2.0" step="0.05" value="1.35" />
    </div>

    <div class="row">
      <div>
        <label>기본 글씨 색상</label>
        <input type="color" id="textColor" value="#ffffff" />
      </div>
      <div>
        <label>강조 색상 [ ]</label>
        <input type="color" id="highlightColor" value="#00ff00" />
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('cardCanvas');
  const ctx = canvas.getContext('2d');

  let loadedImages = [];
  let currentIndex = 0;

  // ==================== 1. API 키 로컬 저장소 관리 ====================
  const apiKeyInput = document.getElementById('apiKeyInput');
  const savedKey = localStorage.getItem('GEMINI_API_KEY');
  if (savedKey) {
    apiKeyInput.value = savedKey;
  }

  document.getElementById('saveKeyBtn').addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    if (!key) {
      alert('API 키를 입력해 주세요.');
      return;
    }
    localStorage.setItem('GEMINI_API_KEY', key);
    alert('이 기기의 브라우저에 API 키가 저장되었습니다!');
  });

  // ==================== 2. AI 타이틀 6개 추천 기능 ====================
  document.getElementById('recommendBtn').addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim() || localStorage.getItem('GEMINI_API_KEY');
    const sourceText = document.getElementById('sourceText').value.trim();
    const customRule = document.getElementById('aiCustomPrompt').value.trim();

    if (!apiKey) {
      alert('먼저 Gemini API 키를 입력해 주세요.');
      return;
    }
    if (!sourceText) {
      alert('분석할 본문 내용을 붙여넣어 주세요.');
      return;
    }

    localStorage.setItem('GEMINI_API_KEY', apiKey);

    const btn = document.getElementById('recommendBtn');
    btn.disabled = true;
    btn.textContent = '⏳ AI가 타이틀 뽑는 중...';

    const prompt = `
다음 본문을 읽고 인스타그램 카드뉴스 상단/하단에 넣을 클릭 유도형(후킹) 타이틀 6개를 추천해 줘.
[필수 규칙]
1. 각 타이틀은 1줄 또는 2줄(줄바꿈 \\n 포함) 이내로 짧고 강렬하게 작성할 것.
2. 각 타이틀에서 가장 핵심이 되는 강조 단어/구절은 반드시 [대괄호]로 감싸줄 것. (예: 하루 10분,\\n[작은 습관이 만드는 거대한 변화])
3. 추가 지침: ${customRule || '없음'}
4. 다른 설명 없이 오직 JSON 문자열 배열 형식으로만 응답할 것. 예: ["타이틀1", "타이틀2", "타이틀3", "타이틀4", "타이틀5", "타이틀6"]

[본문]
${sourceText}
`.trim();

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: 'application/json'
            }
          })
        }
      );

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error?.message || 'API 호출 실패');
      }

      const data = await response.json();
      const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
      const titles = JSON.parse(rawText);

      renderRecommendedTitles(titles);
    } catch (err) {
      alert('AI 추천 중 오류가 발생했습니다: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ AI로 타이틀 6개 추천받기';
    }
  });

  function renderRecommendedTitles(titles) {
    const container = document.getElementById('recContainer');
    const listEl = document.getElementById('recList');
    listEl.innerHTML = '';

    if (!Array.isArray(titles) || titles.length === 0) {
      container.style.display = 'none';
      return;
    }

    container.style.display = 'block';

    titles.forEach((title) => {
      const item = document.createElement('div');
      item.className = 'rec-item';

      const textDiv = document.createElement('div');
      textDiv.className = 'rec-item-text';
      textDiv.textContent = title;

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'rec-actions';

      const applyTopBtn = document.createElement('button');
      applyTopBtn.textContent = '⬆ 위쪽 타이틀로 적용';
      applyTopBtn.addEventListener('click', () => {
        document.getElementById('topText').value = title;
        renderCurrentSlide();
      });

      const applyBottomBtn = document.createElement('button');
      applyBottomBtn.textContent = '⬇ 아래쪽 타이틀로 적용';
      applyBottomBtn.addEventListener('click', () => {
        document.getElementById('bottomText').value = title;
        renderCurrentSlide();
      });

      actionsDiv.appendChild(applyTopBtn);
      actionsDiv.appendChild(applyBottomBtn);

      item.appendChild(textDiv);
      item.appendChild(actionsDiv);
      listEl.appendChild(item);
    });
  }

  // ==================== 3. 기존 캔버스 렌더링 엔진 ====================
  const controls = [
    'canvasSize', 'imageFit', 'bgColor', 'topRatio', 'bottomRatio',
    'topText', 'bottomText', 'fontSize', 'textAlign', 'fontWeight',
    'lineHeight', 'textColor', 'highlightColor'
  ];

  controls.forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      updateLabels();
      renderCurrentSlide();
    });
  });

  function updateLabels() {
    document.getElementById('topRatioVal').textContent = document.getElementById('topRatio').value;
    document.getElementById('bottomRatioVal').textContent = document.getElementById('bottomRatio').value;
    document.getElementById('fontSizeVal').textContent = document.getElementById('fontSize').value;
    document.getElementById('lineHeightVal').textContent = document.getElementById('lineHeight').value;
  }

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    loadedImages = [];
    currentIndex = 0;
    let loadedCount = 0;

    files.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          loadedImages[idx] = img;
          loadedCount++;
          if (loadedCount === files.length) {
            updateSlideNav();
            renderCurrentSlide();
          }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (loadedImages.length > 1 && currentIndex > 0) {
      currentIndex--;
      updateSlideNav();
      renderCurrentSlide();
    }
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (loadedImages.length > 1 && currentIndex < loadedImages.length - 1) {
      currentIndex++;
      updateSlideNav();
      renderCurrentSlide();
    }
  });

  function updateSlideNav() {
    const total = loadedImages.length || 1;
    document.getElementById('slideIndicator').textContent = `${currentIndex + 1} / ${total}`;
  }

  function parseHighlightSegments(line, baseColor, highlightColor) {
    const regex = /\[(.*?)\]/g;
    const segments = [];
    let lastIndex = 0;
    let match;

    while ((match = regex.exec(line)) !== null) {
      if (match.index > lastIndex) {
        segments.push({ text: line.slice(lastIndex, match.index), color: baseColor });
      }
      segments.push({ text: match[1], color: highlightColor });
      lastIndex = regex.lastIndex;
    }
    if (lastIndex < line.length) {
      segments.push({ text: line.slice(lastIndex), color: baseColor });
    }
    return segments;
  }

  function drawRichText(targetCtx, text, boxX, boxY, boxW, boxH, options) {
    if (!text.trim() || boxH <= 0) return;

    const { fontSize, fontWeight, textAlign, lineHeight, textColor, highlightColor } = options;
    targetCtx.font = `${fontWeight} ${fontSize}px 'Noto Sans KR', sans-serif`;
    targetCtx.textBaseline = 'top';

    const lines = text.split('\n');
    const stepH = fontSize * lineHeight;
    const totalTextH = fontSize + stepH * (lines.length - 1);
    let currentY = boxY + (boxH - totalTextH) / 2;

    lines.forEach(line => {
      const segments = parseHighlightSegments(line, textColor, highlightColor);
      const fullLineStr = segments.map(s => s.text).join('');
      const lineW = targetCtx.measureText(fullLineStr).width;

      let currentX = boxX + 60;
      if (textAlign === 'center') {
        currentX = boxX + (boxW - lineW) / 2;
      } else if (textAlign === 'right') {
        currentX = boxX + boxW - lineW - 60;
      }

      segments.forEach(seg => {
        targetCtx.fillStyle = seg.color;
        targetCtx.fillText(seg.text, currentX, currentY);
        currentX += targetCtx.measureText(seg.text).width;
      });

      currentY += stepH;
    });
  }

  function renderToCanvas(targetCanvas, imgObj) {
    const [cw, ch] = document.getElementById('canvasSize').value.split('x').map(Number);
    targetCanvas.width = cw;
    targetCanvas.height = ch;
    const c = targetCanvas.getContext('2d');

    const bgColor = document.getElementById('bgColor').value;
    const topRatio = Number(document.getElementById('topRatio').value) / 100;
    const bottomRatio = Number(document.getElementById('bottomRatio').value) / 100;
    const imageFit = document.getElementById('imageFit').value;

    const topH = Math.round(ch * topRatio);
    const bottomH = Math.round(ch * bottomRatio);
    const midH = Math.max(10, ch - topH - bottomH);

    c.fillStyle = bgColor;
    c.fillRect(0, 0, cw, ch);

    if (imgObj) {
      c.save();
      c.beginPath();
      c.rect(0, topH, cw, midH);
      c.clip();

      const iw = imgObj.width;
      const ih = imgObj.height;
      const scale = imageFit === 'cover'
        ? Math.max(cw / iw, midH / ih)
        : Math.min(cw / iw, midH / ih);

      const drawW = iw * scale;
      const drawH = ih * scale;
      const drawX = (cw - drawW) / 2;
      const drawY = topH + (midH - drawH) / 2;

      c.drawImage(imgObj, drawX, drawY, drawW, drawH);
      c.restore();
    } else {
      c.fillStyle = '#222222';
      c.fillRect(0, topH, cw, midH);
      c.fillStyle = '#888888';
      c.font = "700 32px 'Noto Sans KR', sans-serif";
      c.textAlign = 'center';
      c.fillText('왼쪽에서 사진을 선택해 주세요', cw / 2, topH + midH / 2);
      c.textAlign = 'start';
    }

    c.fillStyle = bgColor;
    if (topH > 0) c.fillRect(0, 0, cw, topH);
    if (bottomH > 0) c.fillRect(0, ch - bottomH, cw, bottomH);

    const textOptions = {
      fontSize: Number(document.getElementById('fontSize').value),
      fontWeight: document.getElementById('fontWeight').value,
      textAlign: document.getElementById('textAlign').value,
      lineHeight: Number(document.getElementById('lineHeight').value),
      textColor: document.getElementById('textColor').value,
      highlightColor: document.getElementById('highlightColor').value,
    };

    drawRichText(c, document.getElementById('topText').value, 0, 0, cw, topH, textOptions);
    drawRichText(c, document.getElementById('bottomText').value, 0, ch - bottomH, cw, bottomH, textOptions);
  }

  function renderCurrentSlide() {
    const imgObj = loadedImages[currentIndex] || null;
    renderToCanvas(canvas, imgObj);
  }

  document.getElementById('downloadCurrentBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `card_${String(currentIndex + 1).padStart(2, '0')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  document.getElementById('downloadZipBtn').addEventListener('click', async () => {
    if (!loadedImages.length) {
      alert('먼저 사진을 1장 이상 선택해 주세요.');
      return;
    }
    const zip = new JSZip();
    const offCanvas = document.createElement('canvas');

    for (let i = 0; i < loadedImages.length; i++) {
      renderToCanvas(offCanvas, loadedImages[i]);
      const dataUrl = offCanvas.toDataURL('image/png');
      const base64Data = dataUrl.replace(/^data:image\/png;base64,/, '');
      zip.file(`carousel_${String(i + 1).padStart(2, '0')}.png`, base64Data, { base64: true });
    }

    const blob = await zip.generateAsync({ type: 'blob' });
    const link = document.createElement('a');
    link.download = 'carousel_images.zip';
    link.href = URL.createObjectURL(blob);
    link.click();
  });

  document.fonts.ready.then(() => {
    renderCurrentSlide();
  });
</script>

</body>
</html>
